name: Release

on:
  push:
    tags: ['v*']

# Serialize retries for a tag without cancelling a build during notarization.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches the app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require('./desktop/package.json');
          const expected = `v${version}`;
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Release tag must be ${expected}; update the app version before tagging.`);
          }
          NODE

  build:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build, sign and notarize macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node <<'NODE'
          const required = ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID',
            'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID'];
          const missing = required.filter(key => !process.env[key]);
          if (missing.length) {
            throw new Error(`Configure these GitHub Actions secrets: ${missing.join(', ')}`);
          }
          NODE
          npm run dist:mac
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      # Unique names are required for matrix jobs with upload-artifact v4.
      # https://github.com/actions/upload-artifact#not-uploading-to-the-same-artifact
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: ${{ runner.os == 'macOS' && 'desktop/dist/distribution/*.dmg' || 'desktop/dist/*.exe' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Only this job can write a release, and only after BOTH builds succeed.
  # https://docs.github.com/en/actions/tutorials/store-and-share-data
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse to overwrite a published release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: process.env.RELEASE_TAG,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              core.setFailed('This release is already published. Use a new version and tag.');
            }
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create or update the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MuClaude ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe

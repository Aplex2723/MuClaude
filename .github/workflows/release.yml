name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
permissions: { contents: write }
# Two merges in a row release one after the other instead of racing for the same tag.
concurrency: { group: release, cancel-in-progress: false }
jobs:
  # Decides whether this push releases anything. Every merge to main runs it, but a release
  # only happens when desktop/package.json carries a version that has no tag yet.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="v$(node -p "require('./desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The update feed carries package.json's version. A mismatched tag would publish files that
            # installed apps consider "not newer", so nobody would be offered the release.
            [ "$TAG" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match desktop/package.json ($TAG)"; exit 1; }
            RELEASE=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already released; bump desktop/package.json to ship a new version."
            RELEASE=false
          else
            RELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    environment: release
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      # Import the Developer ID .p12 into our own keychain instead of passing CSC_LINK:
      # electron-builder 26.x unlocks its temp keychain with the .p12 password
      # (set-key-partition-list -k), which fails with "passphrase not correct".
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
      # Developer ID signing + notarization (electron-builder staples the ticket).
      # The identity is found in the keychain imported above.
      # APPLE_*: credentials used by notarytool. The -c.mac.* flags override the
      # ad-hoc defaults in package.json, which stay as-is for local builds.
      # electron-builder rejects the "Developer ID Application: " prefix, so strip it.
      - run: >
          npx electron-builder --mac --publish never
          -c.mac.identity="${APPLE_SIGNING_IDENTITY#Developer ID Application: }"
          -c.mac.hardenedRuntime=true
          -c.mac.notarize=true
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Verify signature and notarization
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/MuClaude.app
          xcrun stapler validate dist/mac-arm64/MuClaude.app
          spctl --assess --type execute --verbose dist/mac-arm64/MuClaude.app
      - run: npx electron-builder --win --publish never
        if: runner.os == 'Windows'
      - name: Verify the update feed files exist
        shell: bash
        run: |
          # Without these an installed app never sees the release; fail the build instead of shipping silently.
          if [ "$RUNNER_OS" = macOS ]; then want="latest-mac.yml"; else want="latest.yml"; fi
          test -f "dist/$want" || { echo "::error::dist/$want was not generated"; ls dist; exit 1; }
          cat "dist/$want"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          # latest*.yml + .zip + .blockmap are what installed apps read to self-update.
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  # One job publishes the release so the notes are written once, not once per OS.
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # Notes list every commit since the previous stable tag with its author,
      # instead of GitHub's PR-only notes (direct pushes would be left out).
      - name: Write release notes
        env: { TAG: "${{ needs.prepare.outputs.tag }}" }
        run: |
          # HEAD is the released commit for both triggers (the tag may not exist yet on a merge to main).
          PREV=$(git describe --tags --abbrev=0 --exclude '*-*' HEAD^ 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          {
            echo "## Changes"
            git log --no-merges --format='* %s (%h) — %an' "$RANGE"
            [ -n "$PREV" ] && echo && echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
          } > notes.md
      # On a merge to main this creates the tag at the merged commit. Tags created with GITHUB_TOKEN
      # do not start another workflow run, so a release is never built twice.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

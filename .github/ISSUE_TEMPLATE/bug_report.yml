name: Bug report
description: Something did not work
labels: [bug]
body:
  - type: input
    id: os
    attributes: { label: OS and version, placeholder: macOS 15.2 / Windows 11 }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: MuClaude and Claude Desktop versions }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Log output, description: Paste the log from the Apply screen, render: text }
